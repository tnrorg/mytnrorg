<svg width="240" height="240" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tehreek-e-Nojawanan Roundu">
  <defs>
    <linearGradient id="g-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#157A50"/><stop offset="0" stop-color="#157A50"/><stop offset="1" stop-color="#0B3D2E"/>
    </linearGradient>
    <linearGradient id="g-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E4C25B"/><stop offset="1" stop-color="#C9A227"/>
    </linearGradient>
  </defs>
  <!-- outer ring -->
  <circle cx="120" cy="120" r="112" fill="#0A0F0C" stroke="url(#g-gold)" stroke-width="4"/>
  <circle cx="120" cy="120" r="100" fill="none" stroke="url(#g-gold)" stroke-width="1.5" opacity="0.5"/>
  <!-- shield -->
  <path d="M120 40 L182 62 V120 C182 160 154 186 120 200 C86 186 58 160 58 120 V62 Z" fill="url(#g-green)" stroke="url(#g-gold)" stroke-width="3"/>
  <!-- rising star (youth/action) -->
  <path d="M120 78 l7.6 15.4 17 2.5 -12.3 12 2.9 16.9 -15.2 -8 -15.2 8 2.9 -16.9 -12.3 -12 17 -2.5 Z" fill="url(#g-gold)"/>
  <!-- torch flame under star -->
  <path d="M120 150 c-9 0 -15 -7 -15 -15 c0 -8 6 -12 6 -20 c5 6 4 10 9 12 c2 -5 0 -9 3 -14 c6 7 12 12 12 22 c0 8 -6 15 -15 15 Z" fill="url(#g-gold)" opacity="0.95"/>
  <!-- TNR monogram -->
  <text x="120" y="176" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="700" fill="#F7F5EE" letter-spacing="3">TNR</text>
  <!-- wheat sprigs -->
  <g stroke="url(#g-gold)" stroke-width="2.4" fill="none" opacity="0.9">
    <path d="M74 150 q-10 12 -8 30"/>
    <path d="M166 150 q10 12 8 30"/>
  </g>
</svg>
